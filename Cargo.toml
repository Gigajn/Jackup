[workspace]
resolver = "2"
members = [
    "crates/jackup-core",
    "crates/jackup-crypto",
    "crates/jackup-config",
    "crates/jackup-protocol",
    "crates/jackup-transport",
    "crates/jackup-storage",
    "crates/jackup-backup",
    "crates/jackup-orchestrator",
    "crates/jackup-agent",
    "crates/jackup-cli",
    "crates/jackup-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
jackup-core = { path = "crates/jackup-core" }
jackup-crypto = { path = "crates/jackup-crypto" }
jackup-config = { path = "crates/jackup-config" }
jackup-protocol = { path = "crates/jackup-protocol" }
jackup-transport = { path = "crates/jackup-transport" }
jackup-storage = { path = "crates/jackup-storage" }
jackup-backup = { path = "crates/jackup-backup" }
jackup-orchestrator = { path = "crates/jackup-orchestrator" }
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
